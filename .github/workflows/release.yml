name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # required to request the OIDC token for NuGet Trusted Publishing
      contents: write # required to create the GitHub release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          # The SDK global.json pins, plus the runtimes of the older target frameworks.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Determine package version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Both packages share the version, so one tag releases them together.
      - name: Pack
        run: >
          dotnet pack
          --configuration Release
          --output ./artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The page PackageReleaseNotes links to: notes GitHub generates from the changes since the
      # previous tag, with the packages attached. A version with a suffix (1.0.0-preview.2) is
      # marked as a pre-release.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            "${prerelease[@]}"
