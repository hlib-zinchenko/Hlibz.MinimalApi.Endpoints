# Weekly, grouped: one PR for all NuGet updates, one for all GitHub Actions.
# CI runs the tests on every PR, so a green check is what makes these safe to merge.
# FluentValidation and Microsoft.CodeAnalysis.CSharp are deliberately low minimums (see
# Directory.Packages.props), never bumped.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: FluentValidation
      - dependency-name: Microsoft.CodeAnalysis.CSharp
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
